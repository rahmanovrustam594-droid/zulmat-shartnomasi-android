name: Godot Android Export

on:
  push:
    branches: [ main, master ]

jobs:
sh:
    name: Build Godot APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Godot
        uses: abarba/godot-action@v3.2
        with:
          version: 4.3.0
          use-template: true

      - name: Export to Android
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android" build/android/game.apk
